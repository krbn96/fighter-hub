  /tournaments:
    get:
      summary: 大会一覧取得
      description: 有効な大会の一覧を取得する(delete_flag=falseの大会のみ)
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TournamentResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: 大会作成
      description: ADMINユーザーが新しい大会を作成する
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentCreateRequest'

      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentResponse'

        '400':
          description: リクエストが不正、またはBean Validationエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '403':
          description: ADMINではないユーザーによる作成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 403
                error: Forbidden
                message: "User is not an admin. userId=2"
                path: /api/tournaments

        '404':
          description: JWTのsubに対応するユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tournaments/{id}:
    get:
      summary: 大会詳細取得
