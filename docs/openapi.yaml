components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: エラー発生日時
          example: "2026-09-18T12:00:00"
        status:
          type: integer
          description: HTTPステータスコード
          example: 400
        error:
          type: string
          description: HTTPステータスの理由句
          example: Bad Request
