  /teams/{teamId}/applications:
    post:
      summary: チーム参加申請
      description: 認証済みユーザーが指定したチームへの参加を申請する
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: チームID
          example: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  nullable: true
                  description: 申請メッセージ(任意、指定しない場合はnull)
                  example: 一緒に大会に参加したいです！

      responses:
        '201':
          description: 申請作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruitmentApplicationResponse'

        '400':
          description: 自分がownerのチームへ申請した場合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 400
                error: Bad Request
                message: "User cannot apply to their own team. userId=1, teamId=1"
                path: /api/teams/1/applications

        '401':
          description: 認証されていない、または無効なJWT

        '404':
          description: 指定したチームが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 404
                error: Not Found
                message: "Team not found. id=999"
                path: /api/teams/999/applications

        '409':
          description: 同一大会内ですでにいずれかのチームへ所属している、または同一大会内にPENDING状態の申請がすでに存在する
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 409
                error: Conflict
                message: "User already belongs to a team in this tournament. userId=10, tournamentId=1"
                path: /api/teams/1/applications

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: チーム参加申請一覧取得
      description: Team ownerが、自身のチームに届いた参加申請一覧を取得する。PENDING/APPROVED/REJECTEDすべてを含み、createdAt降順で返す
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: チームID
          example: 1

      responses:
        '200':
          description: 申請一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecruitmentApplicationResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '403':
          description: Team ownerではないユーザーによる取得
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 403
                error: Forbidden
                message: "User is not the owner of this team. userId=999, teamId=1"
                path: /api/teams/1/applications

        '404':
          description: 指定したチームが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

