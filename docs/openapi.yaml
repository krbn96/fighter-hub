openapi: 3.0.3

info:
  title: FIGHTER HUB API
  version: 1.0.0

servers:
  - url: /api

paths:
  /auth/login:
    post:
      summary: ログイン
      description: メールアドレスとパスワードで認証し、JWT Access Tokenを発行する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: ユーザーのメールアドレス
                  example: user@example.com
                password:
                  type: string
                  format: password
                  description: ユーザーのパスワード
                  example: password

      responses:
        '200':
          description: 認証成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                properties:
                  accessToken:
                    type: string
                    description: JWTアクセストークン
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

        '400':
          description: リクエストが不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: メールアドレスまたはパスワードが正しくない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /oauth/discord/authorize:
    post:
      summary: Discordアカウント連携開始
      description: >-
        Discord OAuth Authorization Code Flow(scope=identify)を開始するためのAuthorization URLを
        発行する。Discordへの302 redirectはこのAPI自体では行わない(JWT認証が必要なため、
        ブラウザの直接navigationではAuthorizationヘッダーを付けられない)。Frontendは
        レスポンスのauthorizationUrlへ自身でnavigateする。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 発行成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordAuthorizeResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /oauth/discord/callback:
    get:
      summary: Discord OAuth callback
      description: >-
        Discordから呼び出されるcallback。このエンドポイントのみ認証不要(permitAll)。
        state(署名・expiration・purposeを検証)・authorization codeの検証・token交換・
        /users/@me取得・FIGHTER HUBユーザーへの連携(または付け替え)を行い、
        結果に応じてFRONTEND_BASE_URL配下の/mypageへ302 redirectする(JSONは返さない)。
        Discordのaccess/refresh tokenは保存せず、このリクエストの処理中のみ使用して破棄する。
        Discordから返されたerror_descriptionやJava例外メッセージはredirect URLへ含めず、
        固定のreasonコード(cancelled/invalid_state/expired_state/provider_error/server_error)
        のみを使用する。
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Discordから返された認可コード(ユーザーが認可を拒否した場合は付与されない)
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: POST /api/oauth/discord/authorizeで発行した署名付きstate
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: ユーザーがDiscordの認可を拒否した場合等にDiscordから付与される(例 access_denied)
      responses:
        '302':
          description: >-
            FRONTEND_BASE_URL配下の/mypageへredirectする。
            成功時: ?oauth=discord&result=success
            失敗時: ?oauth=discord&result=error&reason=<固定reason>

  /users/{id}:
    get:
      summary: ユーザー公開プロフィール取得
      description: 指定したIDのユーザーの公開プロフィールを取得する
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ユーザーID
          example: 1

      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublicResponse'

        '400':
          description: IDの形式が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-18T12:00:00"
                status: 400
                error: Bad Request
                message: "Invalid value for 'id'."
                path: /api/users/abc

        '404':
          description: 指定したユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-18T12:00:00"
                status: 404
                error: Not Found
                message: "User not found. id=999"
                path: /api/users/999

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      summary: 自分のプロフィール取得
      description: 認証済みユーザー自身のプロフィールを取得する
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '404':
          description: JWTのsubに対応するユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: 自分のプロフィール更新
      description: 認証済みユーザー自身のプロフィールを部分更新する
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'

        '400':
          description: リクエストが不正、またはBean Validationエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '404':
          description: JWTのsubに対応するユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/discord:
    delete:
      summary: Discordアカウント連携解除
      description: >-
        認証済みユーザー自身のDiscordアカウント連携を解除する(discord_id/discord_usernameを
        同時にNULLへ戻す)。未連携状態で呼んでも成功扱いとする冪等API。
      security:
        - BearerAuth: []
      responses:
        '204':
          description: 解除成功(未連携状態だった場合も含む)

        '401':
          description: 認証されていない、または無効なJWT

        '404':
          description: JWTのsubに対応するユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    post:
      summary: ユーザー登録
      description: 新しいユーザーを登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'

        '400':
          description: リクエストが不正、またはBean Validationエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-18T12:00:00"
                status: 400
                error: Bad Request
                message: "email: must be a well-formed email address"
                path: /api/users

        '409':
          description: emailが既に登録されている
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-18T12:00:00"
                status: 409
                error: Conflict
                message: "Email already exists. email=user@example.com"
                path: /api/users

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams:
    get:
      summary: チーム一覧取得
      description: 有効なチームの一覧を取得する
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: チーム作成
      description: 認証済みユーザーをownerとして新しいチームを作成する
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCreateResponse'

        '400':
          description: リクエストが不正、またはBean Validationエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '404':
          description: 指定したtournamentIdが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: >-
            同一Tournament内ですでにいずれかのTeamへ所属している、または対象Tournamentの
            募集締切(recruitmentDeadline)を過ぎている(締切ちょうども含む)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/{id}:
    get:
      summary: チーム詳細取得
      description: 指定したIDのチームを取得する
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: チームID
          example: 1

      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'

        '404':
          description: 指定したチームが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: チーム更新
      description: Team ownerが自身のチーム情報を部分更新する
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: チームID
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'

        '400':
          description: リクエストが不正、またはBean Validationエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '403':
          description: Team ownerではないユーザーによる更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: 指定したチームが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/my:
    get:
      summary: 自分が所属しているチーム一覧取得
      description: 認証済みユーザーがTeamMemberとして所属しているチームの一覧を取得する
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '404':
          description: JWTのsubに対応するユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/{id}/members:
    get:
      summary: チームメンバー一覧取得
      description: 指定したチームに所属しているメンバーの一覧を取得する
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: チームID
          example: 1
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMemberResponse'

        '404':
          description: 指定したチームが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/{teamId}/members/{userId}:
    delete:
      summary: チームメンバー削除
      description: Team ownerが指定したメンバーをチームから削除する
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: チームID
          example: 1

        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 削除するユーザーのID
          example: 2

      responses:
        '204':
          description: 削除成功

        '401':
          description: 認証されていない、または無効なJWT

        '403':
          description: Team ownerではないユーザーによる削除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: 指定したチーム、または指定したメンバーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Team owner自身を削除しようとした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tournaments:
    get:
      summary: 大会一覧取得
      description: |
        有効な大会の一覧を取得する(delete_flag=falseの大会のみ)。
        name/recruitingはいずれも任意で、指定しない場合は絞り込みを行わない。
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: 大会名の部分一致検索(大文字小文字を区別しない)。未指定または空白のみの場合は条件なし。
          example: street

        - name: recruiting
          in: query
          required: false
          schema:
            type: boolean
          description: |
            募集状態での絞り込み。trueは募集中のみ、falseは募集終了のみ、未指定はすべて。
            募集状態はDBカラムではなく、recruitmentDeadlineと現在時刻から判定する
            (締切ちょうどは募集終了として扱う)。
          example: true

      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TournamentResponse'

        '400':
          description: recruitingがbooleanとして解釈できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: 大会作成
      description: ADMINユーザーが新しい大会を作成する
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentCreateRequest'

      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentResponse'

        '400':
          description: リクエストが不正、またはBean Validationエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '403':
          description: ADMINではないユーザーによる作成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 403
                error: Forbidden
                message: "User is not an admin. userId=2"
                path: /api/tournaments

        '404':
          description: JWTのsubに対応するユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tournaments/{id}:
    get:
      summary: 大会詳細取得
      description: 指定したIDの大会を取得する(delete_flag=falseの大会のみ)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 大会ID
          example: 1

      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentResponse'

        '404':
          description: 指定した大会が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 404
                error: Not Found
                message: "Tournament not found. id=999"
                path: /api/tournaments/999

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: 大会更新
      description: ADMINユーザーが大会情報を部分更新する
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 大会ID
          example: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentUpdateRequest'

      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentResponse'

        '400':
          description: リクエストが不正、またはBean Validationエラー(NOT NULL項目への明示的nullを含む)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '403':
          description: ADMINではないユーザーによる更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: JWTのsubに対応するユーザー、または指定した大会が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: 大会削除
      description: ADMINユーザーが大会を論理削除する(delete_flag=trueへ更新するのみで物理削除は行わない)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 大会ID
          example: 1

      responses:
        '204':
          description: 削除成功

        '401':
          description: 認証されていない、または無効なJWT

        '403':
          description: ADMINではないユーザーによる削除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: JWTのsubに対応するユーザー、または指定した大会が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tournaments/{tournamentId}/teams:
    get:
      summary: 大会ごとのチーム一覧取得
      description: 指定した大会に属する有効なチームの一覧を取得する(delete_flag=falseのTeam/Tournament/ownerのみ)
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 大会ID
          example: 1

      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamResponse'

        '404':
          description: 指定した大会が存在しない、またはdelete_flag=true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 404
                error: Not Found
                message: "Tournament not found. id=999"
                path: /api/tournaments/999/teams

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/{teamId}/applications:
    post:
      summary: チーム参加申請
      description: 認証済みユーザーが指定したチームへの参加を申請する
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: チームID
          example: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  nullable: true
                  description: 申請メッセージ(任意、指定しない場合はnull)
                  example: 一緒に大会に参加したいです！

      responses:
        '201':
          description: 申請作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruitmentApplicationResponse'

        '400':
          description: 自分がownerのチームへ申請した場合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 400
                error: Bad Request
                message: "User cannot apply to their own team. userId=1, teamId=1"
                path: /api/teams/1/applications

        '401':
          description: 認証されていない、または無効なJWT

        '404':
          description: 指定したチームが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 404
                error: Not Found
                message: "Team not found. id=999"
                path: /api/teams/999/applications

        '409':
          description: >-
            同一大会内ですでにいずれかのチームへ所属している、同一大会内にPENDING状態の申請が
            すでに存在する、または対象Tournamentの募集締切(recruitmentDeadline)を過ぎている
            (締切ちょうども含む)。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 409
                error: Conflict
                message: "User already belongs to a team in this tournament. userId=10, tournamentId=1"
                path: /api/teams/1/applications

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: チーム参加申請一覧取得
      description: Team ownerが、自身のチームに届いた参加申請一覧を取得する。PENDING/APPROVED/REJECTEDすべてを含み、createdAt降順で返す
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: チームID
          example: 1

      responses:
        '200':
          description: 申請一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecruitmentApplicationResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '403':
          description: Team ownerではないユーザーによる取得
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 403
                error: Forbidden
                message: "User is not the owner of this team. userId=999, teamId=1"
                path: /api/teams/1/applications

        '404':
          description: 指定したチームが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/{teamId}/applications/{applicationId}/approve:
    patch:
      summary: チーム参加申請承認
      description: Team ownerが、自身のチームへの参加申請を承認しTeamMemberとして追加する。TeamMember追加とApplicationのAPPROVED変更は同一トランザクションで行われる
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: チームID
          example: 1

        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 参加申請ID
          example: 1

      responses:
        '200':
          description: 承認成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruitmentApplicationResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '403':
          description: Team ownerではないユーザーによる承認
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: 指定したチームまたは参加申請が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 404
                error: Not Found
                message: "RecruitmentApplication not found. teamId=1, applicationId=999"
                path: /api/teams/1/applications/999/approve

        '409':
          description: 参加申請が処理済み、同一大会内ですでにいずれかのチームへ所属している、またはチームが定員に達している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 409
                error: Conflict
                message: "Team is full. teamId=1"
                path: /api/teams/1/applications/1/approve

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/{teamId}/applications/{applicationId}/reject:
    patch:
      summary: チーム参加申請拒否
      description: Team ownerが、自身のチームへの参加申請を拒否する。TeamMemberは追加されない
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: チームID
          example: 1

        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 参加申請ID
          example: 1

      responses:
        '200':
          description: 拒否成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruitmentApplicationResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '403':
          description: Team ownerではないユーザーによる拒否
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: 指定したチームまたは参加申請が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: 参加申請が処理済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-28T12:00:00"
                status: 409
                error: Conflict
                message: "RecruitmentApplication is already processed. applicationId=1"
                path: /api/teams/1/applications/1/reject

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /applications/me:
    get:
      summary: 自分の参加申請一覧取得
      description: 認証済みユーザー本人が送った参加申請の一覧を取得する。PENDING/APPROVED/REJECTEDすべてを含み、createdAt降順で返す
      security:
        - BearerAuth: []

      responses:
        '200':
          description: 自分の申請一覧取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecruitmentApplicationResponse'

        '401':
          description: 認証されていない、または無効なJWT

        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /characters:
    get:
      summary: キャラクター一覧取得
      description: 登録されているキャラクターを一覧で取得する
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CharacterResponse'

  /characters/{id}:
    get:
      summary: キャラクター詳細取得
      description: 指定したIDのキャラクターを取得する
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: キャラクターID
          example: 1

      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterResponse'

        '400':
          description: IDの形式が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: 指定したキャラクターが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: エラー発生日時
          example: "2026-09-18T12:00:00"
        status:
          type: integer
          description: HTTPステータスコード
          example: 400
        error:
          type: string
          description: HTTPステータスの理由句
          example: Bad Request
        message:
          type: string
          description: エラーメッセージ
          example: Invalid request
        path:
          type: string
          description: リクエストパス
          example: /api/users
    CharacterResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: キャラクターID
          example: 1
        name:
          type: string
          description: キャラクター名
          example: Ryu
    UserCharacterRequest:
      type: object
      required:
        - characterId
        - rank
      properties:
        characterId:
          type: integer
          format: int64
          description: キャラクターID
          example: 1
        rank:
          type: string
          description: キャラクターのランク
          example: MASTER
        mr:
          type: integer
          nullable: true
          description: Master以上の場合のMR
          example: 1800
    UserCharacterResponse:
      type: object
      required:
        - characterId
        - rank
      properties:
        characterId:
          type: integer
          format: int64
          description: キャラクターID
          example: 1
        rank:
          type: string
          description: キャラクターのランク
          example: MASTER
        mr:
          type: integer
          nullable: true
          description: Master以上の場合のMR
          example: 1800
    UserCreateRequest:
      type: object
      required:
        - email
        - password
        - name
        - characters
      properties:
        email:
          type: string
          format: email
          description: ユーザーのメールアドレス
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          description: パスワード
          example: password123
        name:
          type: string
          maxLength: 50
          description: ユーザー名
          example: John Doe
        characters:
          type: array
          minItems: 1
          maxItems: 4
          description: 使用キャラクター情報(1〜4件)
          items:
            $ref: '#/components/schemas/UserCharacterRequest'
        playTimeStart:
          type: string
          format: time
          nullable: true
          description: プレイ開始時間
          example: "18:00:00"
        playTimeEnd:
          type: string
          format: time
          nullable: true
          description: プレイ終了時間
          example: "23:30:00"
        message:
          type: string
          nullable: true
          description: 自己紹介メッセージ
          example: Hello, world!
    UserCreateResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          description: 登録されたユーザーのID
          example: 1
    DiscordAuthorizeResponse:
      type: object
      required:
        - authorizationUrl
      properties:
        authorizationUrl:
          type: string
          format: uri
          description: Frontendがnavigateすべき、Discordの認可画面へのURL(state・redirect_uri等を含む)
          example: >-
            https://discord.com/oauth2/authorize?client_id=123456789012345678&response_type=code
            &redirect_uri=http%3A%2F%2Flocalhost%3A8080%2Fapi%2Foauth%2Fdiscord%2Fcallback
            &scope=identify&state=eyJ1c2VySWQiOjF9.xxxxxxxx
    UserPublicResponse:
      type: object
      required:
        - id
        - name
        - characters
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: ユーザーID
          example: 1
        name:
          type: string
          description: ユーザー名
          example: John Doe
        characters:
          type: array
          description: 使用キャラクター情報
          items:
            $ref: '#/components/schemas/UserCharacterResponse'
        playTimeStart:
          type: string
          format: time
          nullable: true
          description: プレイ開始時間
          example: "18:00:00"
        playTimeEnd:
          type: string
          format: time
          nullable: true
          description: プレイ終了時間
          example: "23:30:00"
        message:
          type: string
          nullable: true
          description: 自己紹介メッセージ
          example: Hello, world!
        xId:
          type: string
          nullable: true
          description: X（旧Twitter）のID
          example: johndoe123
        discordUsername:
          type: string
          nullable: true
          description: >-
            連携済みDiscordアカウントの公開用表示名(username)。内部識別子であるDiscord User ID自体は
            このAPIを含むいかなるレスポンスにも含まれない。未連携の場合はnull。
          example: johndoe
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: "2026-09-01T00:00:00"
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
          example: "2026-09-02T00:00:00"
    UserMeResponse:
      type: object
      required:
        - id
        - name
        - characters
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: ユーザーID
          example: 1
        name:
          type: string
          description: ユーザー名
          example: John Doe
        characters:
          type: array
          description: 使用キャラクター情報
          items:
            $ref: '#/components/schemas/UserCharacterResponse'
        playTimeStart:
          type: string
          format: time
          nullable: true
          description: プレイ開始時間
          example: "18:00:00"
        playTimeEnd:
          type: string
          format: time
          nullable: true
          description: プレイ終了時間
          example: "23:30:00"
        message:
          type: string
          nullable: true
          description: 自己紹介メッセージ
          example: Hello, world!
        email:
          type: string
          format: email
          nullable: true
          description: メールアドレス(DB上NULL許容。将来的なSNSログイン対応のため)
          example: user@example.com
        xId:
          type: string
          nullable: true
          description: X（旧Twitter）のID
          example: johndoe123
        discordUsername:
          type: string
          nullable: true
          description: >-
            連携済みDiscordアカウントの公開用表示名(username)。内部識別子であるDiscord User ID自体は
            このAPIを含むいかなるレスポンスにも含まれない。未連携の場合はnull。
            連携・付け替え・解除は PATCH /api/users/me ではなく、
            POST /api/oauth/discord/authorize → GET /api/oauth/discord/callback の
            OAuthフロー、および DELETE /api/users/me/discord でのみ行う。
          example: johndoe
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: "2026-09-01T00:00:00"
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
          example: "2026-09-02T00:00:00"
    UserUpdateRequest:
      type: object
      description: >-
        部分更新用リクエスト。指定したフィールドのみ更新され、省略したフィールドは変更されない。
        name/charactersは明示的にnullを指定すると400になる。
        xId/discordIdの直接編集はこのAPIでは提供しない
        (Discordアカウント連携はPOST /api/oauth/discord/authorize経由のOAuthフローでのみ行う)。
      properties:
        name:
          type: string
          maxLength: 50
          description: ユーザー名（指定する場合は空文字不可）
          example: John Doe
        characters:
          type: array
          minItems: 1
          maxItems: 4
          description: 使用キャラクター情報(指定する場合は1〜4件)
          items:
            $ref: '#/components/schemas/UserCharacterRequest'
        playTimeStart:
          type: string
          format: time
          nullable: true
          description: プレイ開始時間
          example: "18:00:00"
        playTimeEnd:
          type: string
          format: time
          nullable: true
          description: プレイ終了時間
          example: "23:30:00"
        message:
          type: string
          nullable: true
          description: 自己紹介メッセージ
          example: Hello, world!
    TeamMemberResponse:
      type: object
      required:
        - userId
        - userName
        - joinedAt
      properties:
        userId:
          type: integer
          format: int64
          description: ユーザーID
          example: 1
        userName:
          type: string
          description: ユーザー名
          example: Owner User
        joinedAt:
          type: string
          format: date-time
          description: 加入日時
          example: "2026-09-01T00:00:00"
    TeamCreateRequest:
      type: object
      required:
        - tournamentId
        - name
      properties:
        tournamentId:
          type: integer
          format: int64
          description: 大会ID
          example: 1
        name:
          type: string
          maxLength: 255
          description: チーム名
          example: Team Ryu
        rankRequirement:
          type: string
          maxLength: 30
          nullable: true
          description: 募集ランク条件
          example: MASTER
        characterRequirements:
          type: array
          nullable: true
          description: 募集キャラクターIDのリスト
          items:
            type: integer
            format: int64
          example:
            - 1
            - 2
        recruitmentMessage:
          type: string
          nullable: true
          description: 募集メッセージ
          example: 誰でも歓迎です
    TeamCreateResponse:
      type: object
      required:
        - id
        - tournamentId
        - ownerId
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: チームID
          example: 1
        tournamentId:
          type: integer
          format: int64
          description: 所属する大会ID
          example: 1
        ownerId:
          type: integer
          format: int64
          description: チームownerのユーザーID
          example: 1
        name:
          type: string
          description: チーム名
          example: Team Ryu
        rankRequirement:
          type: string
          nullable: true
          description: 募集ランク条件
          example: MASTER
        characterRequirements:
          type: array
          nullable: true
          description: 募集キャラクターIDのリスト
          items:
            type: integer
            format: int64
          example:
            - 1
            - 2
        recruitmentMessage:
          type: string
          nullable: true
          description: 募集メッセージ
          example: 誰でも歓迎です
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: "2026-09-01T00:00:00"
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
          example: "2026-09-02T00:00:00"
    TeamUpdateRequest:
      type: object
      description: 部分更新用リクエスト。指定したフィールドのみ更新され、省略したフィールドは変更されない。nameは明示的にnullを指定すると400になる。
      properties:
        name:
          type: string
          maxLength: 255
          description: チーム名（指定する場合は空文字不可）
          example: Team Ryu
        rankRequirement:
          type: string
          maxLength: 30
          nullable: true
          description: 募集ランク条件
          example: MASTER
        characterRequirements:
          type: array
          nullable: true
          description: 募集キャラクターIDのリスト
          items:
            type: integer
            format: int64
          example:
            - 1
            - 2
        recruitmentMessage:
          type: string
          nullable: true
          description: 募集メッセージ
          example: 誰でも歓迎です
    RecruitmentApplicationResponse:
      type: object
      required:
        - id
        - teamId
        - userId
        - userName
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: 参加申請ID
          example: 1
        teamId:
          type: integer
          format: int64
          description: チームID
          example: 1
        userId:
          type: integer
          format: int64
          description: 申請ユーザーID
          example: 10
        userName:
          type: string
          description: 申請ユーザー名
          example: John Doe
        message:
          type: string
          nullable: true
          description: 申請メッセージ
          example: 一緒に大会に参加したいです！
        status:
          $ref: '#/components/schemas/RecruitmentApplicationStatus'
        createdAt:
          type: string
          format: date-time
          description: 申請日時
          example: "2026-09-28T12:00:00"
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
          example: "2026-09-28T12:00:00"
    RecruitmentApplicationStatus:
      type: string
      description: 参加申請の状態
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    TournamentResponse:
      type: object
      required:
        - id
        - name
        - teamSize
        - startAt
        - recruitmentDeadline
        - maxPlayers
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          description: 大会ID
          example: 1
        name:
          type: string
          description: 大会名
          example: STREET FIGHTER 6 CUP
        teamSize:
          type: integer
          description: 1チームあたりの人数
          example: 3
        startAt:
          type: string
          format: date-time
          description: 大会開始日時
          example: "2026-10-01T19:00:00"
        recruitmentDeadline:
          type: string
          format: date-time
          description: >-
            FIGHTER HUB上でのチーム募集・参加申請の締切日時。recruitmentDeadline must be before
            startAt(startAtと同時刻は不可)。募集状態(RECRUITING/CLOSED)はDBへ保存せず、
            現在時刻とこの値から導出する(now < recruitmentDeadlineならRECRUITING、
            now >= recruitmentDeadline(ちょうど含む)ならCLOSED)。
          example: "2026-09-25T23:59:00"
        maxPlayers:
          type: integer
          description: 大会の最大参加人数
          example: 64
        createdAt:
          type: string
          format: date-time
          description: 作成日時
          example: "2026-09-01T00:00:00"
        updatedAt:
          type: string
          format: date-time
          description: 更新日時
          example: "2026-09-02T00:00:00"
    TournamentCreateRequest:
      type: object
      required:
        - name
        - teamSize
        - startAt
        - recruitmentDeadline
        - maxPlayers
      properties:
        name:
          type: string
          description: 大会名
          example: STREET FIGHTER 6 CUP
        teamSize:
          type: integer
          minimum: 1
          description: 1チームあたりの人数
          example: 3
        startAt:
          type: string
          format: date-time
          description: 大会開始日時
          example: "2026-10-01T19:00:00"
        recruitmentDeadline:
          type: string
          format: date-time
          description: >-
            FIGHTER HUB上でのチーム募集・参加申請の締切日時。recruitmentDeadline must be before
            startAt(startAtと同時刻は不可。違反時は400 InvalidRequestException)。
          example: "2026-09-25T23:59:00"
        maxPlayers:
          type: integer
          minimum: 1
          description: 大会の最大参加人数
          example: 64
    TournamentUpdateRequest:
      type: object
      description: 部分更新用リクエスト。指定したフィールドのみ更新され、省略したフィールドは変更されない。すべてNOT NULL項目のため、明示的にnullを指定した場合は400になる。
      properties:
        name:
          type: string
          description: 大会名（指定する場合は空文字不可）
          example: STREET FIGHTER 6 CUP
        teamSize:
          type: integer
          minimum: 1
          description: 1チームあたりの人数（指定する場合は1以上）
          example: 3
        startAt:
          type: string
          format: date-time
          description: 大会開始日時
          example: "2026-10-01T19:00:00"
        recruitmentDeadline:
          type: string
          format: date-time
          description: >-
            FIGHTER HUB上でのチーム募集・参加申請の締切日時（指定する場合）。recruitmentDeadline must be
            before startAt(更新適用後の実効値で検証される。startAtのみ変更した場合でも、
            既存recruitmentDeadlineとの関係が不正になれば400になる)。
          example: "2026-09-25T23:59:00"
        maxPlayers:
          type: integer
          minimum: 1
          description: 大会の最大参加人数（指定する場合は1以上）
          example: 64
    TeamResponse:
      type: object
      required:
        - id
        - tournamentId
        - tournamentName
        - ownerId
        - ownerName
        - name
        - createdAt
        - updatedAt
