# Frontend/APIをsame-originにするためのreverse proxy設定。
# axios側のbaseURL('/api')・CORS設定は一切変更せず、Nginx側だけで同一オリジンを成立させる。
#
# X-Forwarded-Proto: 本番ではCaddy(HTTPS終端)がhttps/httpを正しく設定して
# nginxへ転送してくる。この値は上書きせずそのままbackendへ継ぐ必要があるが、
# ローカル開発(compose.yaml)ではCaddyを経由せずブラウザから直接nginxへ到達するため
# ヘッダー自体が存在しない。そのため「ヘッダーがあれば転送、なければ$schemeを使う」
# というmapで両ケースに対応する(本番ではfrontendのportを公開しないため、
# Caddy以外からこのヘッダーを偽装することはできない)。
map $http_x_forwarded_proto $resolved_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # /api/* はbackendへそのまま転送する。
    # proxy_passの後ろにURI(パス)を付けない(ホスト:ポートのみ)ことで、
    # nginxはマッチしたlocationのprefixを書き換えず、元のリクエストURIをそのまま
    # upstreamへ渡す。つまり /api/tournaments は http://backend:8080/api/tournaments
    # としてbackendへ届く(/apiが二重になることも、削除されることもない)。
    # ここに "/" 付きのパスを足すとlocationのprefixがそのパスへ置き換わり、
    # /apiが消えてbackend側のマッピングと一致しなくなるため付けないこと。
    location /api/ {
        proxy_pass http://backend:8080;

        # Authorizationヘッダーを含む通常のHTTPヘッダーは、特別な設定をしなくても
        # nginxのデフォルト挙動でそのまま転送される。以下は一般的なreverse proxyの
        # 慣例としてHost/送信元情報のみ明示的に設定する。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $resolved_forwarded_proto;
    }

    # Vue Router(createWebHistory)対応。実ファイルに一致しないパスはすべて
    # index.htmlを返し、クライアント側のルーティングに委ねる。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
