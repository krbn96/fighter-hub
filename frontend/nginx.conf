# Frontend/APIをsame-originにするためのreverse proxy設定。
# axios側のbaseURL('/api')・CORS設定は一切変更せず、Nginx側だけで同一オリジンを成立させる。
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # /api/* はbackendへそのまま転送する。
    # proxy_passの後ろにURI(パス)を付けない(ホスト:ポートのみ)ことで、
    # nginxはマッチしたlocationのprefixを書き換えず、元のリクエストURIをそのまま
    # upstreamへ渡す。つまり /api/tournaments は http://backend:8080/api/tournaments
    # としてbackendへ届く(/apiが二重になることも、削除されることもない)。
    # ここに "/" 付きのパスを足すとlocationのprefixがそのパスへ置き換わり、
    # /apiが消えてbackend側のマッピングと一致しなくなるため付けないこと。
    location /api/ {
        proxy_pass http://backend:8080;

        # Authorizationヘッダーを含む通常のHTTPヘッダーは、特別な設定をしなくても
        # nginxのデフォルト挙動でそのまま転送される。以下は一般的なreverse proxyの
        # 慣例としてHost/送信元情報のみ明示的に設定する。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router(createWebHistory)対応。実ファイルに一致しないパスはすべて
    # index.htmlを返し、クライアント側のルーティングに委ねる。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
