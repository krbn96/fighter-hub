spring:
  application:
    name: fighter-hub
  datasource:
    url: jdbc:postgresql://localhost:5432/fighter_hub
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 24h

discord:
  client-id: ${DISCORD_CLIENT_ID}
  client-secret: ${DISCORD_CLIENT_SECRET}
  redirect-uri: ${DISCORD_REDIRECT_URI}

oauth:
  state:
    secret: ${OAUTH_STATE_SECRET}

frontend:
  base-url: ${FRONTEND_BASE_URL}
